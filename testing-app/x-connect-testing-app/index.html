<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X-Connect Testing App</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h1 {
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .controls input {
      padding: 0.4rem 0.6rem;
      font-size: 1rem;
    }

    .controls button {
      padding: 0.4rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    #videoContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    video {
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    #remoteVideos {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    #remoteVideos video {
      width: 200px;
      background: #000;
      border-radius: 6px;
    }

    .videos {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .video-box {
      flex: 1;
      min-width: 300px;
    }

    .video-box h3 {
      margin: 0 0 0.3rem;
    }

    video {
      width: 100%;
      background: #000;
      border-radius: 4px;
    }

    #screenShareContainer {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      background: #111;
    }

    #screenShareContainer h3 {
      margin: 0 0 0.5rem;
      color: #4CAF50;
    }

    #screenShareContainer video {
      width: 100%;
      background: #000;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <h1>X-Connect WebRTC Test</h1>

  <!-- Meeting controls -->
  <div class="controls">
    <input id="meetingId" type="text" placeholder="Meeting ID" />
    <input id="userId" type="text" placeholder="User ID" />
    <button id="joinBtn">Join Meeting</button>
    <button id="leaveBtn">Leave Meeting</button>
    <button id="muteBtn">Mute</button>
    <button id="videoBtn">Turn Camera Off</button>
    <button id="screenBtn">Share Screen</button>
  </div>

  <!-- Video elements -->
  <div id="videoContainer">
    <div class="videos">
      <div class="video-box">
        <h3>Local Video</h3>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div class="video-box">
        <h3>Participants</h3>
        <div id="remoteVideos"></div>
      </div>
    </div>
  </div>

  <div id="screenShareContainer">
    <h3>Screen Share</h3>
    <div id="remoteScreens"></div>

  </div>

  <!-- Socket.IO client from CDN -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
